<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root { --bg:#f7f7f8; --card:#fff; --fg:#1b1b1f; --muted:#62626b; --border:#e3e3e8;
  --critical:#d92d20; --high:#e8590c; --medium:#c99a06; --low:#2f6fde; --ok:#1f9d55; }
@media (prefers-color-scheme: dark) { :root { --bg:#111114; --card:#1b1b20; --fg:#ececf1; --muted:#9b9ba6; --border:#2c2c33; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
main { max-width:980px; margin:0 auto; padding:32px 16px 64px; }
h1 { font-size:1.6rem; margin:0 0 4px; word-break:break-all; } h2 { margin-top:40px; }
.meta,.tags { color:var(--muted); margin:0; }
.profile { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin:16px 0 0; }
.summary { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:20px 0; }
.score { font-size:2.4rem; font-weight:700; margin-right:12px; } .score span { font-size:1rem; color:var(--muted); }
.pill { padding:6px 12px; border-radius:999px; color:#fff; font-weight:600; text-transform:capitalize; }
.pill.critical,.finding.critical .sev { background:var(--critical); } .pill.high,.finding.high .sev { background:var(--high); }
.pill.medium,.finding.medium .sev { background:var(--medium); } .pill.low,.finding.low .sev { background:var(--low); }
.notes { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:4px 16px; }
.finding { background:var(--card); border:1px solid var(--border); border-left:5px solid var(--border); border-radius:10px; padding:16px 20px; margin:16px 0; }
.finding.critical { border-left-color:var(--critical); } .finding.high { border-left-color:var(--high); }
.finding.medium { border-left-color:var(--medium); } .finding.low { border-left-color:var(--low); }
.finding h3 { margin:0 0 4px; font-size:1.05rem; }
.sev { color:#fff; font-size:.7rem; text-transform:uppercase; padding:2px 8px; border-radius:6px; vertical-align:middle; }
pre { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px; overflow-x:auto; font-size:.82rem; white-space:pre-wrap; word-break:break-word; }
code { font-size:.88rem; }
img { max-width:100%; border:1px solid var(--border); border-radius:8px; margin-top:8px; }
table { width:100%; border-collapse:collapse; margin:12px 0; background:var(--card); }
th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
.st.passed { color:var(--ok); } .st.failed { color:var(--critical); } .st.blocked,.st.skipped { color:var(--muted); }
</style>
</head>
<body><main>
{{BODY}}
</main></body>
</html>
