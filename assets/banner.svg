<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Pipeline Check — QA your web app like a real human">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>

  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="80" y="128" font-size="64" font-weight="800" fill="#ffffff">Pipeline <tspan fill="url(#accent)">Check</tspan></text>
    <text x="82" y="176" font-size="24" fill="#cbd5e1">QA your web app like a real human — before your users do.</text>
    <text x="82" y="210" font-size="18" fill="#94a3b8">A Claude Code skill · crawl · journeys · roles · APIs · evidence-backed bug reports</text>

    <g font-size="16" font-weight="600">
      <g transform="translate(80 258)">
        <rect width="134" height="44" rx="22" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.6"/>
        <text x="67" y="28" text-anchor="middle" fill="#e0f2fe">1 · Understand</text>
      </g>
      <g transform="translate(226 258)">
        <rect width="124" height="44" rx="22" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.6"/>
        <text x="62" y="28" text-anchor="middle" fill="#e0f2fe">2 · Preflight</text>
      </g>
      <g transform="translate(362 258)">
        <rect width="104" height="44" rx="22" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"/>
        <text x="52" y="28" text-anchor="middle" fill="#dbeafe">3 · Crawl</text>
      </g>
      <g transform="translate(478 258)">
        <rect width="128" height="44" rx="22" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.6"/>
        <text x="64" y="28" text-anchor="middle" fill="#e0e7ff">4 · Journeys</text>
      </g>
      <g transform="translate(618 258)">
        <rect width="150" height="44" rx="22" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.6"/>
        <text x="75" y="28" text-anchor="middle" fill="#ede9fe">5 · Connections</text>
      </g>
      <g transform="translate(780 258)">
        <rect width="106" height="44" rx="22" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-opacity="0.6"/>
        <text x="53" y="28" text-anchor="middle" fill="#f3e8ff">6 · Triage</text>
      </g>
      <g transform="translate(898 258)">
        <rect width="114" height="44" rx="22" fill="#e879f9" fill-opacity="0.18" stroke="#e879f9" stroke-opacity="0.7"/>
        <text x="57" y="28" text-anchor="middle" fill="#fae8ff">7 · Report</text>
      </g>
    </g>
  </g>

  <g transform="translate(1086 64)">
    <circle cx="70" cy="70" r="70" fill="#ffffff" fill-opacity="0.04" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="60" cy="60" r="30" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <line x1="82" y1="82" x2="108" y2="108" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round"/>
    <path d="M46 61 l10 10 l19 -22" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
